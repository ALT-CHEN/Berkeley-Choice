<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}{% endblock %}</title>

  <!-- CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700" rel="stylesheet" />
  {% block css %}{% endblock %}

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Roboto', sans-serif;
      overflow: hidden;
      color: white;
    }

    #vanta-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    #page-content {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    #navbar-wrapper {
      height: 72px;
      z-index: 10;
    }

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 72px;
      background-color: rgb(0, 1, 5);
      backdrop-filter: blur(8px);
      z-index: 1050;
    }

    .nav-link {
      color: white;
      position: relative;
      transition: color 0.2s ease, text-shadow 0.2s ease;
    }

    .nav-link::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 2px;
      background: white;
      left: 0;
      bottom: 0;
      transform: scaleX(0);
      transition: transform 0.3s ease-in-out;
    }

    .nav-link:hover {
      color: white;
    }

    .nav-link:hover::after {
      transform: scaleX(1);
    }

    .signup-btn:hover {
      background-color: #facc15;
      color: #1f2937;
    }

    #main-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
    }

    /* === Yellow Spinner Loader === */
    #page-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }

    #page-loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <!-- 🔄 Fullscreen Yellow Spinner -->
  <div id="page-loader">
    <div class="spinner-border text-warning" style="width: 4rem; height: 4rem;" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <!-- 🌌 Vanta Background Layer -->
  <div id="vanta-bg"></div>

  <!-- 📄 Main Page Content -->
  <div id="page-content">
    <!-- 🔹 Navbar -->
    <div id="navbar-wrapper">
      <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
          <a class="navbar-brand fw-bold text-white px-4 fs-4 d-flex align-items-center gap-2" href="/">
            <img src="{{ url_for('static', filename='images/berkeley_choice_logo.png') }}" alt="Logo" style="height: 40px;">
            Berkeley Choice
          </a>
          <div class="position-absolute top-50 start-50 translate-middle">
            <ul class="navbar-nav d-flex flex-row gap-4">
              <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
              <li class="nav-item"><a class="nav-link" href="/recommend">Recommendations</a></li>
              <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
              <li class="nav-item"><a class="nav-link" href="/contact">Contact</a></li>
            </ul>
          </div>
          <div class="d-flex ms-auto me-3">
            <a class="btn btn-outline-light signup-btn" href="#">Sign Up</a>
          </div>
        </div>
      </nav>
    </div>

    <!-- 🔸 Scrollable Page Body -->
    <div id="main-content">
      {% block body %}{% endblock %}
    </div>
  </div>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>

  <script>
    let setVanta = () => {
      if (window.VANTA) {
        window.vantaEffect = window.VANTA.NET({
          el: "#vanta-bg",
          mouseControls: true,
          touchControls: true,
          gyroControls: false,
          minHeight: 200.00,
          minWidth: 200.00,
          scale: 1.00,
          scaleMobile: 1.00,
          color: 0x724e0d,
          backgroundColor: 0x000000,
          points: 8.00,
          spacing: 18.00
        });
      }
    };

    setVanta();
    window.addEventListener("resize", () => {
      if (window.vantaEffect && window.vantaEffect.resize) {
        window.vantaEffect.resize();
      }
    });

    const loader = document.getElementById("page-loader");

    function showLoader() {
      loader.classList.remove("hidden");
    }

    function hideLoader() {
      loader.classList.add("hidden");
    }

    // Hide on full load
    window.addEventListener("load", hideLoader);
    window.addEventListener("pageshow", hideLoader);

    // Show loader on internal links and form submits
    document.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll("a[href]").forEach(link => {
        const href = link.getAttribute("href");
        const isInternal = href && !href.startsWith("http") && !href.startsWith("#") && !link.hasAttribute("target");
        if (isInternal) {
          link.addEventListener("click", () => showLoader());
        }
      });

      document.querySelectorAll("form").forEach(form => {
        form.addEventListener("submit", () => showLoader());
      });
    });
  </script>
</body>
</html>
