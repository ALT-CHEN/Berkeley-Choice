{% extends 'base.html' %}
{% block title %}About{% endblock %}

{% block css %}
<style>
  .about-container {
    max-width: 960px;
    margin: 4rem auto;
    padding: 2.5rem;
    background-color: rgba(255, 255, 255, 0.07);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    color: white;
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
    border: 2px solid rgba(250, 204, 21, 0.3);
  }

  .about-container h1 {
    font-size: 2.75rem;
    font-weight: 700;
    margin-bottom: 1.5rem;
    color: #facc15;
    text-align: center;
    text-shadow: 0 0 10px rgba(250, 204, 21, 0.3);
  }

  .about-container p {
    font-size: 1.15rem;
    line-height: 1.8;
    margin-bottom: 1rem;
  }

  .highlight {
    color: #facc15;
    font-weight: 600;
  }

  .glow-line {
    height: 4px;
    background: linear-gradient(90deg, #facc15, #ffbb00, #facc15);
    box-shadow: 0 0 10px rgba(250, 204, 21, 0.7);
    border-radius: 10px;
    margin: 2rem 0;
  }
</style>
{% endblock %}

{% block body %}

{% endblock %}
